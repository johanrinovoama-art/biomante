name: Flutter validation

on:
  push:
    branches:
      - main
      - fase-1-estabilizacion
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS project files (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create . --platforms=android,ios --org com.biomante --project-name biomante
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ios/Runner/Info.plist")
          content = path.read_text()
          key = "<key>NSCameraUsageDescription</key>"
          if key not in content:
              content = content.replace(
                  "<dict>",
                  "<dict>\\n\\t<key>NSCameraUsageDescription</key>\\n\\t<string>Biomante uses the camera to scan equipment QR codes.</string>",
                  1,
              )
              path.write_text(content)
          PY

      - name: Check AI backend syntax
        run: node --check backend/server.mjs
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android debug APK (main only)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --debug

      - name: Commit native platform files to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          if git diff --cached --quiet; then
            echo "Native platform files already exist."
            exit 0
          fi
          git commit -m "Generate Android and iOS platform scaffolds"
          git push origin HEAD:main
